# Backend API - Control de Inventario (SoundVault)
# Sin rootDir para que el build tenga acceso a packages/shared (monorepo).
# Conecta el repo y en el Dashboard añade DATABASE_URL, JWT_SECRET, REFRESH_SECRET, CLIENT_URL.
#
# OJO: el servicio en producción se creó a mano, no como Blueprint, así que
# Render NO lee este archivo. Si cambias los comandos de aquí, replícalos en
# Settings -> Build & Deploy. Ver docs/DEPLOY_CHECKLIST.md.

services:
  - type: web
    runtime: node
    name: control-inventario-api
    region: oregon
    # Migraciones versionadas en lugar de `db push`: los dos `migrate resolve`
    # marcan como aplicadas las migraciones que ya existen en la base (baseline)
    # y fallan sin consecuencias si ya estaban registradas.
    buildCommand: >-
      cd packages/shared && npm install && npm run build &&
      cd ../../server && npm install && npx prisma generate &&
      (npx prisma migrate resolve --applied 0_init || true) &&
      (npx prisma migrate resolve --applied 20260831_events || true) &&
      npx prisma migrate deploy && npm run build
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Añadir en el Dashboard: DATABASE_URL, JWT_SECRET, REFRESH_SECRET, CLIENT_URL,
      # CLOUDINARY_URL (obligatorio: el disco de Render es efímero),
      # PUBLIC_API_URL (para que las URLs de /uploads sean absolutas) y
      # PREVIEW_ORIGIN_PATTERN si se usan previews de Vercel.
