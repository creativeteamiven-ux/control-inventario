name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build shared
        working-directory: packages/shared
        run: |
          npm install
          npm run build

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      - name: Install client deps
        working-directory: client
        run: npm install

      - name: Build client (typecheck + bundle)
        working-directory: client
        run: npm run build

      - name: Test client
        working-directory: client
        run: npm test
